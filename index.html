<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رحلتي إلى مصر</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background: #0a192f; color: #fff; text-align: center; padding: 20px; direction: rtl; }
    .card { max-width: 400px; margin: 40px auto; background: #112240; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { color: #e6f1ff; margin-bottom: 10px; }
    p { color: #8892b0; font-size: 14px; margin-bottom: 25px; }
    input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #233554; background: #0a192f; color: #fff; box-sizing: border-box; text-align: center; font-size: 16px; }
    button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
    .btn-gold { background: #cca43b; color: #0a192f; }
    .btn-outline { background: transparent; color: #cca43b; border: 1px solid #cca43b; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card" id="homeView">
    <div style="font-size: 40px; margin-bottom: 10px;">☥</div>
    <h1>رحلتي إلى مصر</h1>
    <p>أدخل رمزك لفتح الذكريات، أو ابدأ رحلة جديدة.</p>
    
    <input type="text" id="codeInput" placeholder="مثال: K7M2QX">
    <button class="btn-gold" onclick="openJourney()">افتح رحلتي</button>
    <p>— أو —</p>
    <button class="btn-outline" onclick="startNewJourney()">ابدأ رحلة جديدة</button>
  </div>

  <div class="card hidden" id="journeyView">
    <h2 id="displayCode">الرمز: ...</h2>
    <p id="statusMsg">جاري التحميل...</p>
    <button class="btn-outline" onclick="location.href=window.location.pathname">الرجوع للرئيسية</button>
  </div>

  <script>
    const SUPABASE_URL = "https://bzmshjplqqrghjghdwdx.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6bXNoanBscXFyZ2hqZ2hkd2R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNjEyMjIsImV4cCI6MjEwMTYzNzIyMn0.dN-fc_eMhjfhBBjHo3Um2C8gbu88j5mnFOO5UstKzOc";
    
    let supabase = null;
    if (window.supabase) {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    function genCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let c = '';
      for (let i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)];
      return c;
    }

    function startNewJourney() {
      const code = genCode();
      window.location.search = '?code=' + code;
    }

    function openJourney() {
      const code = document.getElementById('codeInput').value.trim().toUpperCase();
      if (!code) return alert('برجاء إدخال الرمز أولاً');
      window.location.search = '?code=' + code;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      
      if (code) {
        document.getElementById('homeView').classList.add('hidden');
        document.getElementById('journeyView').classList.remove('hidden');
        document.getElementById('displayCode').textContent = "رمز الرحلة: " + code;
        document.getElementById('statusMsg').textContent = "تم فتح الرحلة بنجاح! الصفحة شغالـة والمفتاح مربوط بنجاح.";
      }
    });
  </script>
</body>
</html>
